# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 259200000  # 3天，单位毫秒 (3 * 24 * 60 * 60 * 1000)

server:
  address: 0.0.0.0
  port: 8104
  servlet:
    context-path: /xzm
    # cookie 30 ???
    session:
      cookie:
        max-age: 2592000
  tomcat:
    # Keep protocol metadata bounded. Resume uploads are governed separately
    # by Spring multipart's 10/12 MB limits below.
    max-http-response-header-size: 32768
    max-http-form-post-size: 12582912
    connection-timeout: 90000ms # 连接超时
    keep-alive-timeout: 90000ms # 保持连接超时

app:
  cors:
    # Production must set APP_CORS_ALLOWED_ORIGINS to its explicit HTTPS frontend origins.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    # Keep blank unless these exact TCP peers are trusted reverse proxies that sanitize/append XFF.
    trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES:}
  interview:
    # Fail startup when an older database has the tables but is missing required agent columns.
    schema-validation-enabled: ${INTERVIEW_SCHEMA_VALIDATION_ENABLED:true}
  algorithm:
    # Fail private by default: never send candidate source to a public third-party
    # runner merely because deployment omitted PISTON_API_URL.
    piston-url: ${PISTON_API_URL:http://127.0.0.1:2000/api/v2/execute}
    piston-token: ${PISTON_API_TOKEN:}
spring:
  application:
    name: xzm_interview_helper
  config:
    # Allows a local ignored .env (KEY=value) while deployment environments use real env vars.
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  # The agent tables are CREATE IF NOT EXISTS only. Running this idempotent schema at startup
  # avoids a clean deployment reaching the interview API before its durable state tables exist.
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/interview_agent_schema.sql
    # Redis ??
#  data:
#    redis:
#      host: 127.0.0.1
#      port: 6379
#      password: ${REDIS_PASSWORD:}   # Supply only through the deployment environment.

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    com.xzm.xzm_interview_helper: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

longcat:
  api-key: ${LONGCAT_API_KEY:}
  base-url: https://api.longcat.chat

# gRPC客户端配置 - 连接Python AI后端
grpc:
  client:
    python-ai-backend:
      address: static://localhost:50051
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s

tencent:
  cloud:
    voice:
      secretId: ${TENCENT_CLOUD_SECRET_ID:}
      secretKey: ${TENCENT_CLOUD_SECRET_KEY:}
