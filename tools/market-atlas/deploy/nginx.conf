# Include inside the existing interview-helper server block.
location = /tools/market-atlas {
    return 301 /tools/market-atlas/$is_args$args;
}

location ^~ /tools/market-atlas/ {
    # No trailing URI: preserve /tools/market-atlas/ for the worker.
    proxy_pass http://127.0.0.1:5174;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header oai-authenticated-user-id "";
    proxy_set_header oai-authenticated-user-email "";
    proxy_buffering off;
    proxy_read_timeout 120s;
}
