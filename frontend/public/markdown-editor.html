<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云雀笔记 · 所见即所得 Markdown</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.4/dist/index.css">
<script src="https://cdn.jsdelivr.net/npm/vditor@3.10.4/dist/index.min.js"></script>
<style>
  :root {
    --primary: #00b878;
    --primary-hover: #00a066;
    --primary-grad: linear-gradient(135deg, #00c97e 0%, #00b3a4 100%);
    --primary-light: rgba(0,190,125,.10);
    --primary-glow: rgba(0,190,130,.35);
    --bg: #edf1f2;
    --panel: #ffffff;
    --sidebar-bg: #f7f9f9;
    --hover: #eceff0;
    --border: #e2e7e7;
    --text: #1c2321;
    --text-secondary: #87938f;
    --danger: #e5484d;
    --dot: rgba(15,80,60,.07);
    --tr-bg: #f8fafa;
    --th-bg: #f2f5f5;
    --radius: 10px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(16,40,32,.05);
    --shadow: 0 4px 16px rgba(16,40,32,.09);
    --shadow-lg: 0 16px 48px rgba(16,40,32,.16);
    --paper-shadow: 0 1px 2px rgba(20,45,36,.05), 0 14px 48px rgba(20,45,36,.09);
    --ease: cubic-bezier(.4,0,.2,1);
    --spring: cubic-bezier(.34,1.56,.64,1);
  }
  [data-theme="dark"] {
    --primary: #00d287;
    --primary-hover: #00e895;
    --primary-grad: linear-gradient(135deg, #00d287 0%, #00b8b0 100%);
    --primary-light: rgba(0,210,135,.13);
    --primary-glow: rgba(0,210,135,.28);
    --bg: #0e1112;
    --panel: #171b1c;
    --sidebar-bg: #121516;
    --hover: #23282a;
    --border: #2b3134;
    --text: #d7dedb;
    --text-secondary: #7c8783;
    --dot: rgba(255,255,255,.05);
    --tr-bg: #1d2223;
    --th-bg: #212627;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow: 0 4px 16px rgba(0,0,0,.45);
    --shadow-lg: 0 16px 48px rgba(0,0,0,.55);
    --paper-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 14px 48px rgba(0,0,0,.42);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s var(--ease), color .3s var(--ease);
  }
  ::selection { background: rgba(0,190,130,.28); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  .main { flex: 1; display: flex; overflow: hidden; animation: fadeIn .35s var(--ease); }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes pulse { 50% { opacity: .25; } }
  @keyframes floaty { to { transform: translateY(-7px); } }
  @keyframes rowIn { from { opacity: 0; transform: translateY(9px); } }
  @keyframes paperIn { from { opacity: .3; transform: translateY(12px); } }
  @keyframes hflash {
    0% { background: var(--primary-light); box-shadow: 0 0 0 5px var(--primary-light); }
    100% { background: transparent; box-shadow: none; }
  }
  .btn-shine { position: relative; overflow: hidden; }
  .btn-shine::after {
    content: ''; position: absolute; top: 0; left: -70%; width: 45%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    transform: skewX(-20deg); transition: left .5s var(--ease); pointer-events: none;
  }
  .btn-shine:hover::after { left: 130%; }

  /* ================= 顶部导航 ================= */
  header {
    height: 54px; background: var(--panel);
    border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
    display: flex; align-items: center;
    padding: 0 14px; gap: 8px; flex-shrink: 0; z-index: 30;
    transition: background-color .3s var(--ease), border-color .3s var(--ease);
  }
  .logo { display: flex; align-items: center; gap: 9px; user-select: none; white-space: nowrap; margin-right: 4px; cursor: default; }
  .logo-badge {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--primary-grad);
    display: grid; place-items: center;
    box-shadow: 0 3px 10px var(--primary-glow);
    transition: transform .35s var(--spring);
  }
  .logo:hover .logo-badge { transform: rotate(-9deg) scale(1.1); }
  .logo-badge svg { width: 17px; height: 17px; }
  .logo-name {
    font-size: 16.5px; font-weight: 700; letter-spacing: .5px;
    background: var(--primary-grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  #docCrumb {
    font-size: 12.5px; color: var(--text-secondary); white-space: nowrap;
    background: var(--hover); padding: 3px 10px; border-radius: 20px;
  }
  #docCrumb:empty { display: none; }
  #docTitle {
    flex: 1; border: none; outline: none;
    font-size: 15px; font-weight: 500;
    padding: 6px 10px; border-radius: 8px;
    min-width: 60px; background: transparent; color: var(--text);
    transition: background-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  #docTitle:hover { background: var(--hover); }
  #docTitle:focus { background: var(--hover); box-shadow: 0 0 0 2px var(--primary-light); }
  .save-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-secondary); white-space: nowrap;
    background: var(--hover); padding: 4px 11px; border-radius: 20px;
  }
  .save-status::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #35c05e; flex: none;
  }
  .save-status.saving::before { background: #f0a020; animation: pulse 1s var(--ease) infinite; }
  .save-status.error { color: var(--danger); }
  .save-status.error::before { background: var(--danger); }
  .header-btn {
    padding: 6px 13px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--panel); cursor: pointer; font-size: 13px; color: var(--text);
    white-space: nowrap; user-select: none;
    transition: border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .header-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .header-btn:active { transform: translateY(0) scale(.96); }
  .header-btn.primary {
    background: var(--primary-grad); color: #fff; border: none;
    box-shadow: 0 2px 10px var(--primary-glow);
  }
  .header-btn.primary:hover { color: #fff; box-shadow: 0 5px 16px var(--primary-glow); filter: brightness(1.05); }
  .icon-btn { padding: 6px 10px; }

  /* ================= 侧边栏 ================= */
  aside {
    width: 272px; background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    transition: margin-left .28s var(--ease), background-color .3s var(--ease), border-color .3s var(--ease);
  }
  aside.collapsed { margin-left: -272px; }
  .sidebar-head { padding: 14px 16px 6px; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-head b { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); letter-spacing: 1.5px; }
  .sidebar-inner { padding: 0 12px; }
  .btn-row { display: flex; gap: 8px; margin: 4px 0 10px; }
  .new-doc-btn {
    flex: 1; padding: 9px; color: #fff;
    background: var(--primary-grad);
    border: none; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 500;
    box-shadow: 0 3px 10px var(--primary-glow);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
  }
  .new-doc-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px var(--primary-glow); filter: brightness(1.05); }
  .new-doc-btn:active { transform: scale(.97); }
  .new-folder-btn {
    padding: 8px 12px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px; cursor: pointer; font-size: 13px;
    transition: border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
  }
  .new-folder-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
  .search-wrap { position: relative; margin-bottom: 8px; }
  .search-wrap::before {
    content: '🔍'; position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%); font-size: 12px; opacity: .5; pointer-events: none;
  }
  #searchInput {
    width: 100%; padding: 8px 11px 8px 31px;
    border: 1px solid var(--border); border-radius: 9px;
    font-size: 13px; outline: none; background: var(--panel); color: var(--text);
    transition: border-color .2s, box-shadow .2s;
  }
  #searchInput:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .doc-list { flex: 1; overflow-y: auto; padding: 2px 10px 12px; }
  .doc-list.drag-over-root { background: var(--primary-light); }
  .list-enter > * { animation: rowIn .34s var(--ease) both; animation-delay: calc(var(--i, 0) * 26ms); }

  .folder-row, .doc-item {
    padding: 8px 10px; border-radius: 9px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    font-size: 13.5px; margin-bottom: 1px; user-select: none;
    position: relative;
    transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  .folder-row:hover, .doc-item:hover { background: var(--hover); }
  .folder-row { font-weight: 500; }
  .folder-row .chev {
    width: 12px; font-size: 10px; color: var(--text-secondary);
    display: inline-block; transition: transform .28s var(--ease);
  }
  .folder-node.collapsed .chev { transform: rotate(-90deg); }
  .kids-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .28s var(--ease); }
  .folder-node.collapsed .kids-wrap { grid-template-rows: 0fr; }
  .folder-kids {
    overflow: hidden; min-height: 0;
    margin: 0 0 4px 13px; padding-left: 7px; border-left: 1px solid var(--border);
  }
  .f-name, .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f-count { font-size: 11px; color: var(--text-secondary); background: var(--hover); padding: 1px 7px; border-radius: 10px; }
  .empty-hint { font-size: 12px; color: var(--text-secondary); padding: 6px 9px; opacity: .7; }
  .doc-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
  .doc-item.active::before {
    content: ''; position: absolute; left: 2px; top: 25%;
    width: 3px; height: 50%; border-radius: 2px; background: var(--primary-grad);
  }
  .doc-item.dragging { opacity: .4; }
  .doc-time { font-size: 11px; color: var(--text-secondary); }
  .doc-tag { font-size: 11px; color: var(--text-secondary); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pin-ico { font-size: 10px; opacity: .9; flex: none; }
  .row-actions { display: none; gap: 1px; }
  .folder-row:hover .row-actions, .doc-item:hover .row-actions { display: flex; }
  .folder-row:hover .f-count { display: none; }
  .mini-btn {
    border: none; background: none; cursor: pointer; color: var(--text-secondary);
    font-size: 12.5px; padding: 2px 5px; border-radius: 5px; line-height: 1.4;
    transition: color .15s var(--ease), background-color .15s var(--ease);
  }
  .mini-btn:hover { color: var(--primary); background: var(--primary-light); }
  .mini-btn.danger:hover { color: var(--danger); background: rgba(229,72,77,.12); }
  .drag-over { background: var(--primary-light) !important; box-shadow: inset 0 0 0 1.5px var(--primary); }
  .list-divider { font-size: 11px; color: var(--text-secondary); padding: 10px 9px 4px; letter-spacing: 1px; user-select: none; }
  .list-empty { text-align: center; padding: 46px 10px; color: var(--text-secondary); font-size: 13px; }
  .list-empty .le-icon { font-size: 34px; margin-bottom: 10px; animation: floaty 2.6s ease-in-out infinite alternate; }
  .list-empty .le-sub { font-size: 11.5px; opacity: .7; margin-top: 4px; }

  .trash-entry {
    flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-top: 1px solid var(--border);
    font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none;
    transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  .trash-entry:hover { background: var(--hover); color: var(--text); }
  .trash-entry.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
  .t-label { flex: 1; }
  .t-count { font-size: 11px; background: var(--hover); padding: 1px 8px; border-radius: 10px; }
  .t-count:empty { display: none; }
  .trash-head { display: flex; align-items: center; gap: 8px; padding: 8px 6px 10px; font-size: 12.5px; color: var(--text-secondary); }
  .trash-head b { color: var(--text); font-size: 13px; }
  .th-n { flex: 1; font-size: 11px; }

  /* ================= 编辑器区 ================= */
  .editor-area {
    flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0;
    position: relative;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.6px);
    background-size: 22px 22px;
    transition: background-color .3s var(--ease);
  }
  .canvas-fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; }
  .blob.b1 { width: 520px; height: 520px; left: -150px; top: -180px;
    background: radial-gradient(circle, rgba(0,205,130,.5), transparent 65%); }
  .blob.b2 { width: 460px; height: 460px; right: -140px; top: 26%;
    background: radial-gradient(circle, rgba(0,165,255,.32), transparent 65%); }
  .blob.b3 { width: 420px; height: 420px; left: 18%; bottom: -220px;
    background: radial-gradient(circle, rgba(150,110,255,.28), transparent 65%); }
  [data-theme="dark"] .blob { opacity: .32; }

  #editorHost { flex: 1; min-height: 0; position: relative; z-index: 1; }
  #editorHost.fs-mode { z-index: 200; }
  #vditor { height: 100%; }
  .load-fail {
    height: 100%; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; color: var(--text-secondary); font-size: 14px;
  }
  #scrim { position: fixed; inset: 54px 0 0 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); z-index: 35; }

  footer {
    height: 30px; background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 14px;
    font-size: 12px; color: var(--text-secondary); flex-shrink: 0;
    position: relative; z-index: 2;
    transition: background-color .3s var(--ease), border-color .3s var(--ease);
  }
  #statStore { margin-left: auto; }
  .meter { width: 56px; height: 4px; border-radius: 2px; background: var(--hover); overflow: hidden; flex: none; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--primary-grad); transition: width .5s var(--ease); }
  .meter i.warn { background: linear-gradient(90deg, #f0a020, #e5484d); }

  /* ================= Vditor 皮肤 ================= */
  .vditor, .vditor--dark {
    --panel-background-color: var(--panel);
    --toolbar-background-color: var(--panel);
    --textarea-background-color: var(--panel);
    --toolbar-icon-color: #96a19c;
    --toolbar-icon-hover-color: var(--primary);
    --border-color: var(--border);
  }
  .vditor { border: none !important; border-radius: 0 !important; background: transparent !important; }
  .vditor--fullscreen {
    background-color: var(--bg) !important;
    background-image: radial-gradient(var(--dot) 1px, transparent 1.6px);
    background-size: 22px 22px;
  }
  /* ★ 工具栏:flex 单行布局,永不折行(dropdown 面板不受裁剪,overflow 保持可见) */
  .vditor-toolbar {
    background: var(--panel) !important;
    border-bottom: 1px solid var(--border) !important;
    padding: 0 10px 0 16px !important;
    display: flex !important;
    flex-wrap: nowrap !important;
    align-items: center;
    overflow: visible;
  }
  .vditor-toolbar > div { float: none !important; flex: 0 0 auto; }
  .vditor-toolbar__divider {
    float: none !important;
    height: 16px !important;
    margin: 0 6px !important;
    align-self: center;
  }
  /* ★ 大纲按钮激活态(复用原生 vditor-menu--current 类) */
  .vditor-toolbar button[data-type="outline"].vditor-menu--current { color: var(--primary) !important; }
  .vditor-outline { display: none !important; }
  .vditor-content { background: transparent !important; overflow: hidden; }
  .vditor-wysiwyg, .vditor-ir, .vditor-sv { background: transparent !important; }
  .vditor-wysiwyg, .vditor-ir {
    overflow-y: auto !important; overflow-x: hidden !important;
    overscroll-behavior: contain; scrollbar-width: thin; scrollbar-gutter: stable;
  }
  .vditor-wysiwyg pre.vditor-reset, .vditor-ir pre.vditor-reset {
    height: auto !important; overflow: visible !important;
    min-height: calc(100% - 76px);
    max-width: 880px;
    margin: 28px auto 48px !important;
    padding: clamp(30px, 5vh, 54px) clamp(28px, 6vw, 68px) 140px !important;
    background: var(--panel) !important;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--paper-shadow);
    box-sizing: border-box;
    caret-color: var(--primary);
    transition: background-color .3s var(--ease), border-color .3s var(--ease);
  }
  .paper-in { animation: paperIn .3s var(--ease); }
  .vditor-sv { padding: 28px clamp(20px, 4vw, 48px) 120px !important; }
  .vditor-preview { background: transparent !important; }
  .vditor-preview .vditor-reset { max-width: 880px; margin: 0 auto; padding: 32px clamp(20px, 4vw, 48px) 100px !important; }

  .vditor-reset { font-family: inherit !important; font-size: 15px !important; line-height: 1.9 !important; color: var(--text); }
  .vditor-reset h1, .vditor-reset h2, .vditor-reset h3,
  .vditor-reset h4, .vditor-reset h5, .vditor-reset h6 { scroll-margin-top: 18px; letter-spacing: -.2px; }
  /* 标题折叠只改变阅读层的可见性，不写入 Markdown 内容。 */
  .vditor-wysiwyg .vditor-reset h1, .vditor-wysiwyg .vditor-reset h2,
  .vditor-wysiwyg .vditor-reset h3, .vditor-wysiwyg .vditor-reset h4,
  .vditor-wysiwyg .vditor-reset h5, .vditor-wysiwyg .vditor-reset h6 {
    position: relative; margin-left: -24px; padding-left: 24px; border-radius: 8px;
  }
  .vditor-wysiwyg .vditor-reset h1::before, .vditor-wysiwyg .vditor-reset h2::before,
  .vditor-wysiwyg .vditor-reset h3::before, .vditor-wysiwyg .vditor-reset h4::before,
  .vditor-wysiwyg .vditor-reset h5::before, .vditor-wysiwyg .vditor-reset h6::before {
    content: '⌄'; position: absolute; left: 5px; top: .05em; width: 17px; height: 17px;
    display: grid; place-items: center; color: var(--text-secondary); font-size: 15px; line-height: 1;
    border-radius: 5px; transform-origin: 50% 52%; transition: transform .18s var(--ease), background-color .18s var(--ease), color .18s var(--ease);
  }
  .vditor-wysiwyg .vditor-reset h1:hover::before, .vditor-wysiwyg .vditor-reset h2:hover::before,
  .vditor-wysiwyg .vditor-reset h3:hover::before, .vditor-wysiwyg .vditor-reset h4:hover::before,
  .vditor-wysiwyg .vditor-reset h5:hover::before, .vditor-wysiwyg .vditor-reset h6:hover::before { color: var(--primary); background: var(--primary-light); }
  .vditor-wysiwyg .vditor-reset .section-folded::before { transform: rotate(-90deg); }
  .vditor-wysiwyg .vditor-reset .section-fold-hidden { display: none !important; }
  .vditor-reset h1, .vditor-reset h2 { padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .h-flash { animation: hflash 1.1s var(--ease); border-radius: 6px; }
  .vditor-reset blockquote {
    border-left: 4px solid var(--primary) !important;
    background: var(--primary-light); color: var(--text-secondary);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 4px 16px !important; margin: 1em 0;
  }
  .vditor-reset img { max-width: 100%; border-radius: var(--radius); box-shadow: var(--shadow); cursor: zoom-in; }
  .vditor-reset :not(pre) > code {
    background: rgba(135,131,120,.14) !important;
    color: #d15b5b !important; border-radius: 4px; padding: 2px 6px !important; font-size: 13px !important;
  }
  [data-theme="dark"] .vditor-reset :not(pre) > code { color: #e88787 !important; }
  .vditor-reset pre > code {
    background: var(--th-bg) !important; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px !important; font-size: 13.5px !important;
  }
  .vditor-reset a { color: var(--primary) !important; text-underline-offset: 3px; }
  .vditor-reset li::marker { color: var(--primary); }
  .vditor-reset input[type=checkbox] { accent-color: var(--primary); }
  .vditor-reset table th { background: var(--th-bg) !important; }
  .vditor-reset table tr:nth-child(2n) td { background: var(--tr-bg); }
  .vditor-reset hr {
    border: none !important; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border) 18%, var(--border) 82%, transparent);
  }

<body>

<script>
'use strict';
/* ═══════════ 常量与工具 ═══════════ */
const DOCS_KEY = 'lark-notes-v2', OLD_KEY = 'lark-notes-v1',
      IMG_KEY = 'lark-notes-imgs-v1', THEME_KEY = 'lark-theme', OUTLINE_KEY = 'lark-outline';
const $ = id => document.getElementById(id);
const titleInput = $('docTitle');
const COMPRESS_THRESHOLD = 300 * 1024, MAX_DIMENSION = 1600, STORE_LIMIT = 5 * 1048576,
      TRASH_TTL = 30 * 864e5;
const mqMobile = matchMedia('(max-width: 900px)');
let docsLen = (localStorage.getItem(DOCS_KEY) || '').length,
    imgsLen = (localStorage.getItem(IMG_KEY) || '').length;

function toast(msg, opt = {}) {
  const t = $('toast'); $('toastMsg').textContent = msg;
  const b = $('toastAct');
  if (opt.label) {
    b.style.display = ''; b.textContent = opt.label;
    b.onclick = () => { clearTimeout(t._timer); t.classList.remove('show'); opt.fn && opt.fn(); };
  } else b.style.display = 'none';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), opt.dur || 1800);
}
function genImgId() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ═══════════ 对话框 ═══════════ */
const dlg = (() => {
  const mask = $('dlgMask'), title = $('dlgTitle'), msg = $('dlgMsg'),
        input = $('dlgInput'), ok = $('dlgOk'), cancel = $('dlgCancel'),
        card = mask.querySelector('.dlg');
  let resolver = null, prevFocus = null;
  function open(opt) {
    return new Promise(res => {
      resolver = res; prevFocus = document.activeElement;
      title.textContent = opt.t;
      msg.textContent = opt.m || ''; msg.style.display = opt.m ? '' : 'none';
      input.style.display = opt.useInput ? 'block' : 'none';
      input.value = opt.value || ''; input.placeholder = opt.placeholder || '';
      cancel.style.display = opt.alert ? 'none' : '';
      ok.textContent = opt.okText || (opt.alert ? '知道了' : '确定');
      card.classList.toggle('danger', !!opt.danger);
      mask.classList.add('show');
      setTimeout(() => opt.useInput ? (input.focus(), input.select()) : ok.focus(), 60);
    });
  }
  function close(val) {
    if (!resolver) return;
    mask.classList.remove('show');
    const r = resolver; resolver = null; r(val);
    try { prevFocus && prevFocus.focus && prevFocus.focus(); } catch {}
  }
  ok.onclick = () => close(input.style.display === 'none' ? true : input.value);
  cancel.onclick = () => close(null);
  mask.addEventListener('mousedown', e => { if (e.target === mask) close(null); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ok.click(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && mask.classList.contains('show')) close(null);
  });
  return {
    confirm: (t, m) => open({ t, m, danger: true, okText: '确认' }),
    prompt: (t, value, placeholder) => open({ t, useInput: true, value, placeholder }),
    alert: (t, m) => open({ t, m, alert: true }),
    isOpen: () => mask.classList.contains('show')
  };
})();

/* ═══════════ 存储层 ═══════════ */
const imgStore = {
  data: {},
  load() { try { this.data = JSON.parse(localStorage.getItem(IMG_KEY)) || {}; } catch { this.data = {}; } },
  save() {
    try { const s = JSON.stringify(this.data); localStorage.setItem(IMG_KEY, s); imgsLen = s.length; return true; }
    catch { toast('⚠️ 图片存储已满，请删除部分图片'); return false; }
  }
};
imgStore.load();

function collapseDataUrls(md) {
  return md.replace(/\((data:image\/[^)]+)\)/g, (m, data) => {
    const id = genImgId(); imgStore.data[id] = data; imgStore._dirty = true;
    return `(img://${id})`;
  });
}
function saveState(st) {
  try { const s = JSON.stringify(st || state); localStorage.setItem(DOCS_KEY, s); docsLen = s.length; return true; }
  catch { toast('⚠️ 存储空间已满，请删除部分文档或图片'); return false; }
}
function loadState() {
  try {
    const v2 = JSON.parse(localStorage.getItem(DOCS_KEY));
    if (v2 && Array.isArray(v2.docs)) return { folders: v2.folders || [], docs: v2.docs, trash: v2.trash || [] };
  } catch {}
  let old = []; try { old = JSON.parse(localStorage.getItem(OLD_KEY)) || []; } catch {}
  const st = { folders: [], docs: [], trash: [] };
  old.forEach(d => {
    if (d.images) Object.assign(imgStore.data, d.images);
    st.docs.push({ id: d.id, folderId: null, title: d.title, content: collapseDataUrls(d.content || ''), updated: d.updated || Date.now() });
  });
  if (old.length) { imgStore.save(); saveState(st); }
  return st;
}
function normalizeState() {
  state.folders = (state.folders || []).filter(f => f && f.id);
  state.docs = (state.docs || []).filter(d => d && d.id);
  state.trash = (state.trash || []).filter(d => d && d.id && Date.now() - (d.deletedAt || 0) < TRASH_TTL);
  state.docs.forEach(d => {
    d.content = d.content || ''; d.title = d.title || '无标题文档';
    if (d.autoT === undefined) d.autoT = d.title === '无标题文档';
  });
}
let state = loadState();
normalizeState();

let currentId = null, saveTimer = null, vd = null, editorReady = false,
    viewTrash = false, lastGc = 0;
let scrollMem = {};
const byId = id => state.docs.find(d => d.id === id);
const folderById = id => state.folders.find(f => f.id === id);

/* ═══════════ 图片三层表示 img://id ⇄ blob: ⇄ data: ═══════════ */
let id2blob = {}, blob2id = {};
function blobUrlFor(id) {
  if (id2blob[id]) return id2blob[id];
  const data = imgStore.data[id]; if (!data) return null;
  try {
    const [meta, b64] = data.split(',');
    const mime = (meta.match(/data:([^;]+)/) || [])[1] || 'image/png';
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: mime }));
    id2blob[id] = url; blob2id[url] = id; return url;
  } catch { return null; }
}
function resetBlobCache() {
  Object.keys(blob2id).forEach(u => { try { URL.revokeObjectURL(u); } catch {} });
  id2blob = {}; blob2id = {};
}
const expandForEditor = md => md.indexOf('img://') < 0 ? md
  : md.replace(/img:\/\/(\w+)/g, (m, id) => blobUrlFor(id) || m);
const expandForExport = md => md.indexOf('img://') < 0 ? md
  : md.replace(/img:\/\/(\w+)/g, (m, id) => imgStore.data[id] || m);
function collapseForStore(md) {
  if (md.indexOf('blob:') > -1)
    md = md.replace(/blob:[^\s)"'<>]+/g, u => blob2id[u] ? 'img://' + blob2id[u] : u);
  if (md.indexOf('(data:image') > -1) md = collapseDataUrls(md);
  if (imgStore._dirty) { imgStore.save(); imgStore._dirty = false; }
  return md;
}

/* ═══════════ 持久化 ═══════════ */
function gcImages() {
  const used = new Set();
  [...state.docs, ...state.trash].forEach(d => {
    for (const m of d.content.matchAll(/img:\/\/(\w+)/g)) used.add(m[1]);
  });
  let removed = 0;
  Object.keys(imgStore.data).forEach(id => { if (!used.has(id)) { delete imgStore.data[id]; removed++; } });
  if (removed) imgStore.save();
}
function setSaveUI(mode, text) {
  const s = $('saveStatus');
  s.className = 'save-status' + (mode ? ' ' + mode : '');
  s.textContent = text;
}
function persistNow() {
  clearTimeout(saveTimer); saveTimer = null;
  if (Date.now() - lastGc > 15000) { gcImages(); lastGc = Date.now(); }
  state.docs.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);
  const ok = saveState();
  setSaveUI(ok ? '' : 'error',
    ok ? '已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '保存失败');
  renderList(); updateStorageStat();
}
function schedulePersist() {
  setSaveUI('saving', '保存中…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 600);
}
function flushPersist() { if (saveTimer) persistNow(); }
window.addEventListener('beforeunload', flushPersist);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPersist(); });

let statsT = null, statsPend = '';
function updateStatsNow(content) {
  const chars = content.replace(/img:\/\/\w+/g, '').replace(/\s/g, '').length;
  $('statChars').textContent = chars + ' 字';
  $('statLines').textContent = content.split('\n').length + ' 行';
  $('statTime').textContent = '约 ' + Math.max(1, Math.ceil(chars / 400)) + ' 分钟';
}
function updateStats(content) {
  statsPend = content;
  if (statsT) return;
  statsT = setTimeout(() => { statsT = null; updateStatsNow(statsPend); }, 180);
}
function updateStorageStat() {
  const used = (docsLen + imgsLen) * 2;
  $('statStore').textContent = '占用 ' + (used > 1048576 ? (used / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(used / 1024)) + ' KB');
  const pct = Math.min(100, used / STORE_LIMIT * 100);
  const fill = $('meterFill');
  fill.style.width = pct + '%';
  fill.classList.toggle('warn', pct > 80);
}

/* ═══════════ 文档 CRUD ═══════════ */
function deriveTitle(md) {
  const m = md.match(/^#{1,6}\s+(.+)$/m);
  let t = m ? m[1] : (md.split('\n').find(l => l.trim() && !l.startsWith('```')) || '');
  t = t.replace(/img:\/\/\w+/g, '').replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
       .replace(/[#>*`~_|]/g, '').replace(/\s+/g, ' ').trim();
  return t.slice(0, 40);
}
function newDoc(content = '', title = '无标题文档', folderId = null) {
  viewTrash = false;
  const doc = { id: Date.now() + '' + Math.floor(Math.random() * 1000), folderId, title, content,
                updated: Date.now(), autoT: title === '无标题文档' };
  state.docs.unshift(doc);
  if (folderId) { const f = folderById(folderId); if (f) f.collapsed = false; }
  persistNow(); openDoc(doc.id);
  if (editorReady) vd.focus();
}
function currentMode() { return (vd && typeof vd.getCurrentMode === 'function') ? vd.getCurrentMode() : 'wysiwyg'; }
function edScrollEl() { return document.querySelector('.vditor-' + currentMode()); }
function openDoc(id) {
  const doc = byId(id); if (!doc) return;
  flushPersist();
  if (editorReady && currentId && currentId !== id) {
    const el = edScrollEl(); if (el) scrollMem[currentId] = el.scrollTop;
  }
  viewTrash = false;
  currentId = id;
  titleInput.value = doc.title === '无标题文档' ? '' : doc.title;
  updateCrumb(doc);
  if (doc.folderId) { const f = folderById(doc.folderId); if (f) f.collapsed = false; }
  if (editorReady) {
    vd.setValue(expandForEditor(doc.content), true);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const el = edScrollEl(); if (el) el.scrollTop = scrollMem[id] || 0;
      updateOutlineActive();
    }));
    paperEnter();
    lastOlSig = '';
    setTimeout(() => { if (outlineVisible) refreshOutline(); }, 90);
    scheduleSectionFolding();
  }
  clearTimeout(statsT); statsT = null;
  updateStatsNow(doc.content);
  renderList();
  if (mqMobile.matches) $('sidebar').classList.add('collapsed');
}
function trashDoc(id) {
  const i = state.docs.findIndex(d => d.id === id); if (i < 0) return;
  const [doc] = state.docs.splice(i, 1);
  doc.deletedAt = Date.now();
  state.trash.unshift(doc);
  if (currentId === id) {
    currentId = null;
    state.docs.length ? openDoc(state.docs[0].id) : newDoc();
  }
  persistNow();
  toast('已移入回收站', { label: '撤销', fn: () => restoreDoc(id), dur: 4500 });
}
function restoreDoc(id) {
  const i = state.trash.findIndex(d => d.id === id); if (i < 0) return;
  const [doc] = state.trash.splice(i, 1);
  delete doc.deletedAt;
  if (doc.folderId && !folderById(doc.folderId)) doc.folderId = null;
  state.docs.unshift(doc);
  viewTrash = false;
  persistNow(); openDoc(doc.id);
  toast('♻️ 已恢复');
}
async function purgeDoc(id) {

  state.trash = [];

  persistNow(); renderList(true);
  toast('🗑 回收站已清空');
}
function duplicateDoc(id) {

                title: (s.title || '未命名') + ' 副本', updated: Date.now(), pinned: false, autoT: false };

/* ═══════════ 右键菜单组件 ═══════════ */
const menu = (() => {
  const el = $('ctxMenu');
  function show(x, y, items) {
    el.innerHTML = '';
    items.forEach(it => {
      if (it.sep) { const s = document.createElement('div'); s.className = 'menu-sep'; el.appendChild(s); return; }
      const r = document.createElement('div');
      r.className = 'menu-item' + (it.danger ? ' danger' : '') + (it.disabled ? ' disabled' : '');
      const ic = document.createElement('span'); ic.className = 'mi-ic'; ic.textContent = it.ic || '';
      const lb = document.createElement('span'); lb.textContent = it.label;
      r.append(ic, lb);
      if (!it.disabled) r.addEventListener('click', () => { hide(); it.fn && it.fn(); });
      el.appendChild(r);
    });
    el.classList.add('show');
    const rect = el.getBoundingClientRect();
    if (x + rect.width > innerWidth - 8) x = innerWidth - rect.width - 8;
    if (y + rect.height > innerHeight - 8) y = innerHeight - rect.height - 8;
    el.style.left = Math.max(8, x) + 'px';
    el.style.top = Math.max(8, y) + 'px';
  }
  function hide() { el.classList.remove('show'); }
  document.addEventListener('mousedown', e => { if (!el.contains(e.target)) hide(); }, true);
  window.addEventListener('blur', hide);
  window.addEventListener('resize', hide);
  document.addEventListener('scroll', hide, true);
  return { show, hide };
})();
function showDocMenu(d, x, y) {
  menu.show(x, y, [
    { ic: '📌', label: d.pinned ? '取消置顶' : '置顶文档', fn: () => togglePin(d.id) },
    { ic: '✏️', label: '重命名', fn: () => renameDoc(d.id) },
    { ic: '📄', label: '创建副本', fn: () => duplicateDoc(d.id) },
    { ic: '📁', label: '移动到…', fn: () => showMoveMenu(d, x, y) },
    { ic: '⬇️', label: '导出 Markdown', fn: () => exportMd(d) },
    { sep: true },
    { ic: '🗑️', label: '移入回收站', danger: true, fn: () => trashDoc(d.id) }
  ]);
}
function showMoveMenu(d, x, y) {
  const items = [{ ic: '🏠', label: '未分类（根目录）', disabled: !d.folderId, fn: () => moveDoc(d.id, null) }];
  state.folders.forEach(f => items.push({ ic: '📁', label: f.name, disabled: d.folderId === f.id, fn: () => moveDoc(d.id, f.id) }));
  if (!state.folders.length) items.push({ ic: '💡', label: '暂无文件夹，先创建一个吧', disabled: true });
  setTimeout(() => menu.show(x, y, items), 20);
}

/* ═══════════ 侧边栏渲染（签名缓存） ═══════════ */
const hasDocDrag = e => [...(e.dataTransfer?.types || [])].includes('text/lark-doc');
function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
    : (d.getMonth() + 1) + '/' + d.getDate();
}
function docRow(d, showTag) {

  el.className = 'doc-item' + (d.id === currentId ? ' active' : '');
  el.draggable = true;
  el.innerHTML = `<span>📄</span><span class="doc-name"></span>` +
    (d.pinned ? '<span class="pin-ico">📌</span>' : '') +
    (showTag && d.folderId ? `<span class="doc-tag"></span>` : '') +
    `<span class="doc-time">${fmtTime(d.updated)}</span>
     <span class="row-actions"><button class="mini-btn danger" title="移入回收站">✕</button></span>`;
  el.querySelector('.doc-name').textContent = d.title;
  if (showTag && d.folderId) el.querySelector('.doc-tag').textContent = '📁' + (folderById(d.folderId)?.name || '');
  el.addEventListener('click', () => openDoc(d.id));
  el.addEventListener('contextmenu', e => {

    e.dataTransfer.setData('text/lark-doc', d.id);
    e.dataTransfer.effectAllowed = 'move';

function folderNode(f) {

let lastSig = '', staggered = false;
function renderList(force = false) {
  const kw = $('searchInput').value.trim().toLowerCase();
  const sig = [kw, currentId, viewTrash ? 'T1' : 'T0',
    state.trash.map(d => d.id).join(','),
    state.folders.map(f => f.id + f.name + (f.collapsed ? 1 : 0)).join('¦'),
    state.docs.map(d => d.id + '·' + (d.folderId || '') + '·' + (d.pinned ? 'P' : '') + d.title + '·' + fmtTime(d.updated)).join('¦')
  ].join('␟');
  if (!force && sig === lastSig) return;
  lastSig = sig;

  $('trashCount').textContent = state.trash.length || '';
  $('trashEntry').classList.toggle('active', viewTrash);

  const list = $('docList'); list.innerHTML = '';

  if (viewTrash) {
    const head = document.createElement('div'); head.className = 'trash-head';
    const b = document.createElement('b'); b.textContent = '🗑 回收站';
    const n = document.createElement('span'); n.className = 'th-n'; n.textContent = state.trash.length + ' 项 · 30 天自动清理';
    const back = document.createElement('button'); back.className = 'mini-btn'; back.textContent = '← 返回';
    back.onclick = () => { viewTrash = false; renderList(true); };
    const clr = document.createElement('button'); clr.className = 'mini-btn danger'; clr.textContent = '清空';
    clr.onclick = emptyTrash;
    head.append(b, n, back, clr);
    list.appendChild(head);
    const items = state.trash.filter(d => !kw || d.title.toLowerCase().includes(kw));
    if (!items.length) {
      const h = document.createElement('div'); h.className = 'empty-hint';
      h.textContent = kw ? '没有匹配的文档' : '回收站是空的';
      list.appendChild(h);
    }
    items.forEach(d => {
      const el = document.createElement('div');
      el.className = 'doc-item';
      el.innerHTML = `<span>📄</span><span class="doc-name"></span><span class="doc-time"></span>
        <span class="row-actions">
          <button class="mini-btn" title="恢复">♻️</button>
          <button class="mini-btn danger" title="彻底删除">✕</button>
        </span>`;
      el.querySelector('.doc-name').textContent = d.title;
      el.querySelector('.doc-time').textContent = fmtTime(d.deletedAt || d.updated);
      const [rb, db] = el.querySelectorAll('.mini-btn');

      db.onclick = e => { e.stopPropagation(); purgeDoc(d.id); };
      list.appendChild(el);
    });
    return;
  }

  if (kw) {
    const hits = state.docs.filter(d =>
      d.title.toLowerCase().includes(kw) || d.content.toLowerCase().includes(kw));
    if (!hits.length) { const h = document.createElement('div'); h.className = 'empty-hint'; h.textContent = '没有匹配的文档'; list.appendChild(h); }
    hits.forEach(d => list.appendChild(docRow(d, true)));

  if (!state.folders.length && !state.docs.length) {
    const e = document.createElement('div'); e.className = 'list-empty';
    e.innerHTML = '<div class="le-icon">🌱</div><div>还没有笔记</div><div class="le-sub">点击上方「新建文档」开始记录</div>';
    list.appendChild(e); return;

  if (state.folders.length && roots.length) {

  }

  if (editorReady && !staggered) {

/* ═══════════ 标题折叠：仅修改编辑器 DOM 的阅读状态，不污染 Markdown ═══════════ */
let sectionFoldTimer = null, headingFoldRoot = null, sectionItems = [];
const sectionFoldStates = new Map();
function getSectionFoldState() {
  const id = currentId || '__draft__';
  if (!sectionFoldStates.has(id)) sectionFoldStates.set(id, new Map());
  return sectionFoldStates.get(id);
}
function getEditableRoot() {
  return currentMode() === 'wysiwyg'
    ? document.querySelector('.vditor-wysiwyg .vditor-reset')
    : null;
}
function getRootChild(root, el) {
  let block = el;
  while (block && block.parentElement !== root) block = block.parentElement;
  return block && block.parentElement === root ? block : null;
}
function refreshSectionFolding() {
  if (!editorReady || currentMode() !== 'wysiwyg') return;
  const root = getEditableRoot();
  if (!root) return;
  const blocks = Array.from(root.children).filter(el => el.nodeType === 1);
  const headings = Array.from(root.querySelectorAll('h1,h2,h3,h4,h5,h6'));
  const state = getSectionFoldState();
  const blockHeadings = new Map();
  sectionItems = headings.map((heading, index) => {
    const block = getRootChild(root, heading);
    const text = (heading.textContent || '').replace(/^#+\s*/, '').trim() || '未命名标题';
    const key = `${index}:${heading.tagName}:${text}`;
    if (block) blockHeadings.set(block, { heading, index, key, level: +heading.tagName[1] });
    heading.classList.add('section-foldable');
    heading.classList.toggle('section-folded', !!state.get(key));

function compressImage(dataUrl, type) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_DIMENSION / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const out = type === 'image/png' ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', .85);
      resolve(out.length < dataUrl.length ? out : dataUrl);
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

  if (!file || !file.type.startsWith('image/')) return;
  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  let finalUrl = dataUrl;
  if (dataUrl.length > COMPRESS_THRESHOLD && file.type !== 'image/gif')
    finalUrl = await compressImage(dataUrl, file.type);
  const id = genImgId();
  imgStore.data[id] = finalUrl;
  if (!imgStore.save()) { delete imgStore.data[id]; return; }
  const name = (file.name || '图片').replace(/[\[\]()]/g, '');
  vd.insertValue(`\n![${name}](${blobUrlFor(id)})\n`);
  onEditorInput(vd.getValue());
  toast(finalUrl !== dataUrl ? '✅ 图片已压缩插入' : '✅ 图片已插入');
}

    { ic: '⬇️', label: '导出 Markdown', fn: () => exportMd() },
    { ic: '🌐', label: '导出 HTML（内嵌图片）', fn: exportHtml },
    { ic: '🖨️', label: '打印 / 另存为 PDF', fn: printDoc },
    { sep: true },
    { ic: '💾', label: '备份全部数据 (JSON)', fn: backupAll },
    { ic: '📥', label: '恢复备份…', fn: () => $('mdFile').click() }
  ]);
};
$('importBtn').onclick = () => $('mdFile').click();
$('mdFile').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files) {
    let text; try { text = await f.text(); } catch { toast('⚠️ 读取失败：' + f.name); continue; }
    if (/\.json$/i.test(f.name)) await restoreFromJson(text);
    else { newDoc(collapseForStore(text), f.name.replace(/\.(md|markdown|txt)$/i, '')); toast('📥 已导入 ' + f.name); }
  }
});
$('copyBtn').onclick = async () => {
  const doc = byId(currentId); if (!doc) return;
  try { await navigator.clipboard.writeText(expandForExport(doc.content)); toast('📋 已复制（含完整图片）'); }
  catch { toast('⚠️ 复制失败，请检查浏览器权限'); }
};

function showHelp() {
  dlg.alert('⌨️ 快捷键与技巧',
`Ctrl/⌘ + K —— 命令面板（搜文档 / 执行命令）
Ctrl/⌘ + S —— 立即保存
Ctrl/⌘ + / —— 本帮助
Esc —— 关闭任意弹层

右键文档 —— 置顶 / 重命名 / 副本 / 移动 / 回收站
拖动文档 —— 移入文件夹，拖到空白处移出

标题留空 —— 自动取正文首个标题作为文档名
删除文档 —— 先进回收站，30 天内可恢复`);
}
const palette = (() => {
  const mask = $('palMask'), input = $('palInput'), listEl = $('palList');
  let items = [], sel = 0, open = false;
  const actions = [
    { ic: '📝', label: '新建文档', kw: 'new', fn: () => newDoc() },
    { ic: '📁', label: '新建文件夹', kw: 'folder', fn: newFolder },
    { ic: '🌓', label: '切换明暗主题', kw: 'theme dark light', fn: () => $('themeBtn').click() },
    { ic: '📑', label: '开关大纲面板', kw: 'outline', fn: () => toggleOutline() },
    { ic: '▾', label: '按标题收起全部内容', kw: 'collapse fold headings', fn: () => collapseAllSections(true) },
    { ic: '›', label: '展开全部标题内容', kw: 'expand unfold headings', fn: () => collapseAllSections(false) },
    { ic: '🧘', label: '专注模式（隐藏侧栏与大纲）', kw: 'zen focus', fn: zenToggle },
    { ic: '⬇️', label: '导出 Markdown', kw: 'export md', fn: () => exportMd() },
    { ic: '🌐', label: '导出 HTML', kw: 'export html', fn: exportHtml },
    { ic: '🖨️', label: '打印 / 另存为 PDF', kw: 'print pdf', fn: printDoc },
    { ic: '💾', label: '备份全部数据 (JSON)', kw: 'backup json', fn: backupAll },
    { ic: '📥', label: '导入文件 / 恢复备份…', kw: 'import restore', fn: () => $('mdFile').click() },
    { ic: '🗑️', label: '打开回收站', kw: 'trash', fn: () => { viewTrash = true; renderList(true); } },
    { ic: '⌨️', label: '快捷键帮助', kw: 'help keys shortcut', fn: showHelp }
  ];
  function build(q) {
    items = [];
    const ql = q.trim().toLowerCase();
    const docs = state.docs.filter(d => !ql || d.title.toLowerCase().includes(ql)).slice(0, ql ? 12 : 7);
    let extra = [];
    if (ql && docs.length < 12) {
      const seen = new Set(docs.map(d => d.id));
      extra = state.docs.filter(d => !seen.has(d.id) && d.content.toLowerCase().includes(ql)).slice(0, 12 - docs.length);
    }
    [...docs, ...extra].forEach(d => items.push({
      ic: d.pinned ? '📌' : '📄', label: d.title,
      hint: (d.folderId ? (folderById(d.folderId)?.name || '') + ' · ' : '') + fmtTime(d.updated),
      fn: () => openDoc(d.id)
    }));
    actions.forEach(a => {
      if (!ql || a.label.toLowerCase().includes(ql) || a.kw.includes(ql)) items.push(a);
    });
    sel = 0; render();
  }
  function render() {
    listEl.innerHTML = '';
    if (!items.length) {
      const d = document.createElement('div'); d.className = 'pal-empty'; d.textContent = '没有匹配的文档或命令';
      listEl.appendChild(d); return;
    }
    items.forEach((it, i) => {
      const r = document.createElement('div');
      r.className = 'pal-item' + (i === sel ? ' sel' : '');
      const ic = document.createElement('span'); ic.className = 'pal-ic'; ic.textContent = it.ic;
      const lb = document.createElement('span'); lb.className = 'pal-lb'; lb.textContent = it.label;
      r.append(ic, lb);
      if (it.hint) { const h = document.createElement('span'); h.className = 'pal-hint'; h.textContent = it.hint; r.appendChild(h); }
      r.addEventListener('mousemove', () => { if (sel !== i) { sel = i; paint(); } });
      r.addEventListener('click', () => run(i));
      listEl.appendChild(r);
    });
  }
  function paint() { [...listEl.children].forEach((c, i) => c.classList.toggle('sel', i === sel)); }
  function ensure() { const c = listEl.children[sel]; if (c) c.scrollIntoView({ block: 'nearest' }); }
  function run(i) { const it = items[i]; if (!it) return; close(); setTimeout(() => it.fn(), 10); }
  function openP() {
    if (open) return; open = true;
    mask.classList.add('show'); input.value = ''; build('');
    setTimeout(() => input.focus(), 40);
  }
  function close() { if (!open) return; open = false; mask.classList.remove('show'); }
  input.addEventListener('input', () => build(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) { sel = (sel + 1) % items.length; paint(); ensure(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) { sel = (sel - 1 + items.length) % items.length; paint(); ensure(); } }
    else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
    else if (e.key === 'Escape') close();
  });
  mask.addEventListener('mousedown', e => { if (e.target === mask) close(); });
  return { toggle: () => open ? close() : openP(), close, isOpen: () => open };
})();

/* ═══════════ 全局键盘 ═══════════ */
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'k') {
    e.preventDefault(); e.stopPropagation();
    if (!dlg.isOpen()) palette.toggle();
  } else if (k === 's') {
    e.preventDefault(); persistNow(); toast('💾 已保存');
  } else if (e.key === '/') {
    e.preventDefault(); showHelp();
  }
}, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (dlg.isOpen()) return;
  if (palette.isOpen()) { palette.close(); return; }
  menu.hide();
  $('lightbox').classList.remove('show');
});
